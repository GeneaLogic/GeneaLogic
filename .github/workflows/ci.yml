name: CI

# Protects the cross-platform contract (CLAUDE.md): the engine must build and
# pass on Linux (for the eventual Vapor server) as well as macOS. Both packages
# — GeneaLogicKit (engine) and GeneaLogicCLI — are tested on both OSes.
#
# Note: this does NOT use scripts/linux-test.sh. That script drives Apple's
# `container` tool, which needs an Apple-Silicon host and can't run on hosted
# runners; here the Linux job runs directly inside the official swift:6.3 image
# on an Ubuntu runner — same goal (prove it builds + tests on Linux), different
# vehicle.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `macos-26`, not `macos-15`: both packages declare a macOS 26 platform floor (matched
  # to the app's own deployment target), which an older runner cannot build.
  macos:
    name: macOS (packages)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test GeneaLogicKit
        run: swift test --package-path GeneaLogicKit
      - name: Test GeneaLogicCLI
        run: swift test --package-path GeneaLogicCLI

  linux:
    name: Linux (swift:6.3)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test GeneaLogicKit
        run: swift test --package-path GeneaLogicKit
      - name: Test GeneaLogicCLI
        run: swift test --package-path GeneaLogicCLI

  # The Mac app (GeneaLogicApp) is an Xcode project targeting macOS 26.5, so it
  # needs the macos-26 image and Xcode 26.5 (the default Xcode on that image is
  # 26.4.1, whose SDK can't satisfy a 26.5 deployment target). The packages are
  # built by the `macos` job above, now on the same image for the same reason.
  #
  # `test`, not `build`, since slice 52: the app grew a unit-test target
  # (`GeneaLogicAppTests`) covering undo/redo across every mutation kind and the
  # main actor's responsiveness under cross-process contention. Both are things
  # only the app target can exercise, and undo in particular fails *silently*
  # when it breaks — a compile gate would not have caught any of it.
  #
  # The tests need a test host, so unlike the old build-only gate this one signs
  # locally (`-` is the ad-hoc identity); `CODE_SIGNING_ALLOWED=NO` would leave an
  # unlaunchable host.
  mac-app:
    name: macOS app (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: xcodebuild -version
      - name: Test GeneaLogicApp
        run: |
          xcodebuild \
            -project GeneaLogicApp/GeneaLogicApp.xcodeproj \
            -scheme GeneaLogicApp \
            -destination 'platform=macOS' \
            test CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
